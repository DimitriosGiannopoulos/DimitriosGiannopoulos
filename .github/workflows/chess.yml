name: "Chess Game"

on:
  issues:
    types: [opened]

jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v3

      - name: Play Chess
        uses: milaabl/readme-chess@master
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
