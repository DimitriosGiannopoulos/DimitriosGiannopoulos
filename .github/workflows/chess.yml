name: "Chess Game"

on:
  issues:
    types: [opened]

jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Checkout Engine Code
        uses: actions/checkout@v4
        with:
          repository: 'milaabl/readme-chess'
          path: 'engine'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Copy Engine and Run Move
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cp -r engine/data ./ 2>/dev/null || true
          cp -r engine/src ./ 2>/dev/null || true
          cp engine/main.py ./
          python main.py
          rm -rf engine main.py src

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "♟️ Chess move updated"
