<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice">
  <rect width="100%" height="100%" fill="#0d1117"/>

  <style>
    @keyframes rain {
      0% { transform: translateY(-500px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(500px); opacity: 0; }
    }
    .m-text {
      fill: #00ff66;
      font-family: monospace;
      font-size: 16px;
      animation: rain 3.5s linear infinite;
      text-shadow: 0 0 8px #00ff66;
    }
    .d1 { animation-delay: 0s; }   .d2 { animation-delay: 0.4s; }
    .d3 { animation-delay: 0.8s; }  .d4 { animation-delay: 1.2s; }
    .d5 { animation-delay: 1.6s; }  .d6 { animation-delay: 2.0s; }
    .d7 { animation-delay: 2.4s; }  .d8 { animation-delay: 2.8s; }
  </style>

